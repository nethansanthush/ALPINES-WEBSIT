<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="Alpine sustainable nursery and cultivation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF4EE"/>
      <stop offset="100%" stop-color="#DCE7DC"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FFF9E6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFF9E6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A6547"/>
      <stop offset="100%" stop-color="#5C402B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="24" fill="url(#bg)"/>
  <!-- Greenhouse arches -->
  <path d="M60 560 L60 220 C60 105 210 55 400 55 C590 55 740 105 740 220 L740 560" stroke="#9CB5A1" stroke-width="5" stroke-opacity="0.55"/>
  <path d="M150 560 L150 245 C150 155 260 115 400 115 C540 115 650 155 650 245 L650 560" stroke="#B7CBB9" stroke-width="3" stroke-opacity="0.55"/>
  <!-- Sunbeam -->
  <polygon points="160,0 440,0 710,560 320,560" fill="url(#beam)"/>
  <!-- Distant nursery canopy -->
  <ellipse cx="400" cy="405" rx="310" ry="70" fill="#C2D8C4" opacity="0.55"/>
  <!-- Wooden nursery table -->
  <rect x="75" y="425" width="650" height="28" rx="6" fill="url(#wood)"/>
  <rect x="115" y="453" width="26" height="115" fill="#4A3321"/>
  <rect x="659" y="453" width="26" height="115" fill="#4A3321"/>
  <rect x="95" y="485" width="610" height="14" rx="4" fill="#6F4E35" opacity="0.65"/>

  <!-- Seedling trays & terracotta pots -->
  <g>
    <!-- Left tray -->
    <polygon points="130,382 325,382 315,425 140,425" fill="#3D2B1F"/>
    <rect x="124" y="376" width="207" height="10" rx="4" fill="#5B402D"/>
    <!-- Sprouts in left tray -->
    <g fill="#2D6A4F">
      <path d="M175 376 C175 335 206 318 220 330 C210 352 194 368 175 376 Z"/>
      <path d="M173 376 C158 340 135 336 126 352 C142 368 158 375 173 376 Z"/>
      <path d="M235 376 C235 326 270 304 286 320 C274 346 256 365 235 376 Z"/>
      <path d="M233 376 C214 334 188 328 178 346 C196 364 214 373 233 376 Z"/>
      <path d="M292 376 C292 338 318 322 330 334 C321 354 307 368 292 376 Z"/>
    </g>

    <!-- Center hero terracotta pot & healthy plant -->
    <polygon points="365,342 455,342 442,425 378,425" fill="#B56B45"/>
    <rect x="358" y="330" width="104" height="16" rx="5" fill="#C97C53"/>
    <path d="M410 330 L410 220" stroke="#2D6A4F" stroke-width="5" stroke-linecap="round"/>
    <path d="M410 285 C375 275 352 246 364 232 C386 238 402 258 410 285 Z" fill="#1B4332"/>
    <path d="M410 278 C448 265 470 235 456 222 C434 228 418 250 410 278 Z" fill="#2D6A4F"/>
    <path d="M410 245 C382 225 376 190 392 182 C408 194 414 218 410 245 Z" fill="#40916C"/>
    <path d="M410 240 C438 220 450 185 432 178 C416 192 410 215 410 240 Z" fill="#52B788"/>

    <!-- Right coir pots -->
    <polygon points="505,365 568,365 560,425 513,425" fill="#7D5A3C"/>
    <polygon points="588,365 651,365 643,425 596,425" fill="#7D5A3C"/>
    <path d="M536 365 C536 320 568 300 582 315 C570 338 554 354 536 365 Z" fill="#2D6A4F"/>
    <path d="M534 365 C516 325 492 320 484 335 C500 352 518 362 534 365 Z" fill="#40916C"/>
    <path d="M619 365 C619 318 652 296 668 312 C654 336 638 354 619 365 Z" fill="#1B4332"/>
    <path d="M617 365 C598 326 574 322 566 338 C582 354 600 362 617 365 Z" fill="#2D6A4F"/>
  </g>
</svg>
